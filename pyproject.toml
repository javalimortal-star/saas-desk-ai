[project]
name = "saas-desk-ai"
version = "0.1.0"
description = "Human-reviewed AI-assisted support request triage"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6,<5.7",
    "Django>=6.0,<6.1",
    "djangorestframework>=3.17,<3.18",
    "drf-spectacular>=0.29,<0.30",
    "dj-database-url>=3.0,<4",
    "gunicorn>=23,<24",
    "openai>=3.0,<4",
    "pydantic>=2.13,<3",
    "psycopg[binary]>=3.2,<3.3",
    "whitenoise[brotli]>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["support_requests/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "support_requests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
