<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SaaS Desk AI</title></head>
<body>
  <main>
    <h1>Como podemos ajudar?</h1>
    <p><strong>Esta é uma demonstração:</strong> use somente dados fictícios. Não envie dados pessoais ou confidenciais.</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div role="alert">
          <strong>Corrija os erros abaixo.</strong>
        </div>
      {% endif %}
      {{ form.as_p }}
      <button type="submit">Enviar solicitação</button>
    </form>
    <nav aria-label="Links da demonstração">
      <a href="{% url 'support_requests:analyst-login' %}">Entrar como Analista</a>
      <a href="{% url 'api-docs' %}">Documentação da API</a>
      <a href="https://github.com/javalimortal-star/saas-desk-ai">Código-fonte</a>
    </nav>
  </main>
</body>
</html>
