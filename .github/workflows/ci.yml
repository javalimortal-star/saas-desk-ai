name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saas_desk_ai
          POSTGRES_USER: saas_desk_ai
          POSTGRES_PASSWORD: saas_desk_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_desk_ai -d saas_desk_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: saas_desk_ai
      POSTGRES_USER: saas_desk_ai
      POSTGRES_PASSWORD: saas_desk_ai
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      ANALYSIS_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py spectacular --validate --fail-on-warn --file openapi.yaml
      - run: python -m pytest -q
