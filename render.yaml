databases:
  - name: saas-desk-ai-db
    plan: free

services:
  - type: keyvalue
    name: saas-desk-ai-broker
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: saas-desk-ai-web
    plan: free
    runtime: docker
    dockerCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    preDeployCommand: python manage.py migrate
    initialDeployHook: python manage.py seed_demo
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-desk-ai-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: saas-desk-ai-broker
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ANALYSIS_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_ANALYST_PASSWORD
        value: demo-password

  - type: worker
    name: saas-desk-ai-worker
    plan: starter
    runtime: docker
    dockerCommand: celery -A config worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-desk-ai-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: saas-desk-ai-broker
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ANALYSIS_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_ANALYST_PASSWORD
        value: demo-password
