databases:
  - name: saas-desk-ai-db
    plan: free

services:
  - type: web
    name: saas-desk-ai-web
    plan: free
    runtime: docker
    dockerCommand: /bin/sh -c 'python manage.py migrate && python manage.py bootstrap_demo && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT'
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-desk-ai-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ANALYSIS_PROVIDER
        value: openrouter
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_ANALYST_PASSWORD
        value: demo-password
